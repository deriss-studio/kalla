name: invariants

on:
  push:
    branches: [main]
  pull_request:

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The seven invariants. These are the specification, not a smoke test.
      # If one fails, the change is wrong — do not weaken the test to pass.
      - run: npm test
